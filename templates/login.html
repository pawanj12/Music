<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minerva Music - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 8px;

            text-align: center;
        }

        h2 {
            margin: 0 0 30px;

            text-align: center;

            font-size: 20px;

            font-weight: normal;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #111;

            color: #fff;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .error {
            margin-bottom: 20px;

            padding: 12px;

            background: #ffecec;

            color: #c00;

            border-radius: 8px;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Minerva Music</h1>

        <h2>Admin Login</h2>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
